default_install_hook_types:
  - pre-commit
  - pre-push
repos:
- repo: local
  hooks:
  - id: check-quality
    name: check code quality with current Home Assistant
    entry: uv run poe check-current
    language: system
    types: [python]
    stages: ["pre-commit"]
    require_serial: false
    always_run: true

  - id: test
    name: run unit tests with current Home Assistant
    entry: uv run poe test-current
    language: system
    types: [python]
    stages: ["pre-push"]
    require_serial: true
    always_run: true
    pass_filenames: false
